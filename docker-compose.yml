services:
  database:
    image: postgres:16-alpine
    container_name: apexauto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  s3:
    image: adobe/s3mock:5.0.0
    container_name: apexauto_s3
    restart: unless-stopped
    environment:
      initialBuckets: ${AWS__BucketName:?AWS__BucketName is required}
      retainFilesOnExit: "true"
    ports:
      - "127.0.0.1:${S3_PORT:?S3_PORT is required}:9090"
    volumes:
      - s3data:/s3mockroot

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - maildata:/data

  # Production-image smoke test: docker compose --profile full up --build
  api:
    profiles: ["full"]
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtSettings__Secret: ${JwtSettings__Secret:?JwtSettings__Secret is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      AllowedHosts: ${AllowedHosts:?AllowedHosts is required}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  s3data:
  maildata:
