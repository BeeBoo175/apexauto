services:
  database:
    image: postgres:16-alpine
    container_name: apexauto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexauto_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apexauto_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  s3:
    image: adobe/s3mock:latest
    container_name: apexauto_s3
    restart: unless-stopped
    environment:
      initialBuckets: apexauto-media
      retainFilesOnExit: "true"
    ports:
      - "${S3_PORT:-9090}:9090"
    volumes:
      - s3data:/root/.s3mock

volumes:
  pgdata:
  s3data:
